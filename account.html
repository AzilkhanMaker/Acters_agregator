<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Rick Astley Live</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="brand-title">Rick Astley Live</a>
        <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">☰</button>
        <div class="mobile-menu" id="mobileMenu">
            <nav>
                <a href="index.html">Главная</a>
                <a href="prices.html">Цены и концерты</a>
                <a href="register.html">Регистрация</a>
                <a href="account.html">Личный кабинет</a>
                <a href="login.html">Вход</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <h2>Личный кабинет</h2>

        <div style="background: #fff; padding: 24px; border-radius: 12px; margin-top: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
            <h3>Профиль</h3>
            <p style="margin-top: 10px;"><strong>Имя:</strong> <span id="accName">—</span></p>
            <p style="margin-top: 8px;"><strong>Телефон:</strong> <span id="accPhone">—</span></p>
            <p style="margin-top: 8px;">
                <strong>Email:</strong> <span id="accEmail">—</span><span id="adminBadge" style="display: none; margin-left: 6px; color: var(--success-color); font-weight: 700;" title="Администратор">✔</span>
            </p>
            <p style="margin-top: 8px;"><strong>Карта:</strong> <span id="accCard">Не привязана</span></p>

            <div id="adminAccessSection" style="margin-top: 18px; padding: 14px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;">
                <p style="font-size: 0.9rem; margin-bottom: 8px;"><strong>Активация прав администратора:</strong></p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="password" id="adminCodeInput" placeholder="Код доступа" style="padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px;">
                    <button type="button" id="activateAdminBtn" class="btn-primary">Активировать</button>
                </div>
                <p id="adminCodeMsg" style="font-size: 0.85rem; margin-top: 6px; color: var(--error-color);"></p>
            </div>

            <div id="adminConsoleLinkBox" style="display: none; margin-top: 14px;">
                <a href="admin-console.html" class="btn-primary">Открыть консоль администратора</a>
            </div>

            <h3 style="margin-top: 24px;">Мои заказы и билеты</h3>
            <div id="ticketHistory" style="margin-top: 12px; background: #f3f4f6; padding: 14px; border-radius: 8px;">
                <p style="color: #4b5563;">Загрузка...</p>
            </div>

            <div style="margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap;">
                <a href="prices.html" class="btn-secondary">Купить ещё билеты</a>
                <button type="button" id="logoutBtn" class="btn-secondary" style="background: #fee2e2; color: #b91c1c;">Выйти</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p><a href="index.html">&larr; На главную</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
