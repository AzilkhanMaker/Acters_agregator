<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Rick Astley Live</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="brand-title">Rick Astley Live</a>
        <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">☰</button>
        <div class="mobile-menu" id="mobileMenu">
            <nav>
                <a href="index.html">Главная</a>
                <a href="prices.html">Цены и концерты</a>
                <a href="register.html">Регистрация</a>
                <a href="account.html">Личный кабинет</a>
                <a href="login.html">Вход</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <section style="max-width: 450px; margin: 16px auto; padding: 28px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.07);">
            <h1 style="text-align: center; margin-bottom: 18px; font-size: 1.5rem;">Вход в аккаунт</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" autocomplete="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль:</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="Введите пароль" oncopy="return false;">
                        <button type="button" id="toggleLoginPassBtn" class="btn-secondary" style="padding: 0 12px;">👁</button>
                    </div>
                </div>

                <div id="loginError" class="error-message" style="text-align: center; margin-bottom: 10px;"></div>

                <button type="submit" class="submit-btn" style="width: 100%;">Войти</button>
            </form>

            <p style="text-align: center; margin-top: 14px;">
                <a href="#" id="forgotPasswordLink" style="color: var(--accent-color); font-size: 0.9rem; font-weight: 600;">Забыли пароль / Сбросить через почту</a>
            </p>

            <div id="resetBox" style="display: none; margin-top: 14px; padding: 14px; background: #f3f4f6; border-radius: 8px;">
                <p style="font-size: 0.85rem; margin-bottom: 10px;">Укажите Email в поле выше — Firebase отправит письмо со ссылкой для сброса пароля:</p>
                <button type="button" id="sendResetCodeBtn" class="btn-primary" style="padding: 8px 14px; font-size: 0.88rem;">Отправить письмо</button>
                <div id="resetStatus" style="font-size: 0.85rem; margin-top: 8px; word-break: break-word;"></div>
            </div>

            <p style="text-align: center; margin-top: 18px;">
                Нет аккаунта? <a href="register.html" style="color: var(--accent-color); font-weight: 600;">Зарегистрироваться</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p><a href="index.html">&larr; На главную</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
