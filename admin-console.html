<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консоль управления билетами - Rick Astley Live</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <header class="header">
        <button class="burger-btn" id="burgerBtn" aria-label="Открыть меню">☰</button>
        <div class="mobile-menu" id="mobileMenu">
            <nav>
                <a href="index.html">Главная</a>
                <a href="prices.html">Цены и концерты</a>
                <a href="account.html">Личный кабинет</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <h2>Консоль управления концертами и билетами</h2>
        <div id="adminConsolePanel" style="background: white; padding: 25px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                <!-- Шаг 1: Добавление актёра -->
                <div style="background: #f4f5fa; padding: 20px; border-radius: 8px;">
                    <h3>1. Добавить актёра / исполнителя</h3>
                    <form id="addActorForm" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                        <div class="form-group">
                            <label for="actorNameInput">Имя актёра / артиста:</label>
                            <input type="text" id="actorNameInput" placeholder="Например: Rick Astley" required>
                        </div>
                        <button type="submit" class="submit-btn" style="padding: 10px; font-size: 1rem;">Добавить актёра</button>
                    </form>
                </div>

                <!-- Шаг 2: Создание концерта и билетов на основе актёра -->
                <div style="background: #f4f5fa; padding: 20px; border-radius: 8px;">
                    <h3>2. Создать концерт и билеты</h3>
                    <form id="createConcertForm" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                        <div class="form-group">
                            <label for="concertActorSelect">Выберите актёра:</label>
                            <select id="concertActorSelect" required style="padding: 10px; border: 1px solid #777; border-radius: 4px;"></select>
                        </div>
                        <div class="form-group">
                            <label for="concertCityInput">Город и площадка:</label>
                            <input type="text" id="concertCityInput" placeholder="Усть-Каменогорск, КСК «Болашак»" required>
                        </div>
                        <div class="form-group">
                            <label for="concertDateInput">Дата проведения:</label>
                            <input type="text" id="concertDateInput" placeholder="25 ноября 2026" required>
                        </div>
                        <div class="form-group">
                            <label for="concertPriceInput">Цена билета (₸):</label>
                            <input type="number" id="concertPriceInput" min="1000" step="500" placeholder="15000" required style="padding: 10px; border: 1px solid #777; border-radius: 4px;">
                        </div>
                        <div class="form-group">
                            <label for="concertTicketsCountInput">Количество билетов для выпуска:</label>
                            <input type="number" id="concertTicketsCountInput" min="1" max="500" value="20" required style="padding: 10px; border: 1px solid #777; border-radius: 4px;">
                        </div>
                        <button type="submit" class="submit-btn" style="padding: 10px; font-size: 1rem; background: #16a34a;">Создать концерт и билеты</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <footer class="footer">
        <p><a href="account.html">&larr; Вернуться в личный кабинет</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
