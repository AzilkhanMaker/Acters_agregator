<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консоль администратора - Rick Astley Live</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="brand-title">Rick Astley Live</a>
        <button type="button" class="burger-btn" id="burgerBtn" aria-label="Открыть меню">☰</button>
        <div class="mobile-menu" id="mobileMenu">
            <nav>
                <a href="index.html">Главная</a>
                <a href="prices.html">Цены и концерты</a>
                <a href="register.html">Регистрация</a>
                <a href="account.html">Личный кабинет</a>
                <a href="login.html">Вход</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <h2>Консоль управления</h2>
        <div id="adminConsolePanel" style="background: #fff; padding: 24px; border-radius: 12px; margin-top: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
            <form id="addActorForm" style="margin-bottom: 24px;">
                <h3>Добавить артиста</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <label for="actorNameInput">Имя артиста:</label>
                    <input type="text" id="actorNameInput" placeholder="Rick Astley" required>
                </div>
                <button type="submit" class="btn-primary">Добавить артиста</button>
            </form>

            <form id="createConcertForm">
                <h3>Создать концерт и билеты</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <label for="concertActorSelect">Артист:</label>
                    <select id="concertActorSelect"></select>
                </div>
                <div class="form-group">
                    <label for="concertCityInput">Город и площадка:</label>
                    <input type="text" id="concertCityInput" placeholder="Алматы, Дворец Республики" required>
                </div>
                <div class="form-group">
                    <label for="concertDateInput">Дата:</label>
                    <input type="text" id="concertDateInput" placeholder="25 декабря 2026" required>
                </div>
                <div class="form-group">
                    <label for="concertPriceInput">Цена (₸):</label>
                    <input type="number" id="concertPriceInput" min="1000" placeholder="15000" required>
                </div>
                <div class="form-group">
                    <label for="concertTicketsCountInput">Количество билетов:</label>
                    <input type="number" id="concertTicketsCountInput" min="1" max="500" placeholder="50" required>
                </div>
                <button type="submit" class="submit-btn">Создать концерт</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p><a href="account.html">&larr; В личный кабинет</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
