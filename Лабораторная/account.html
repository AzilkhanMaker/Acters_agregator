<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Rick Astley Live</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <header class="header">
        <button class="burger-btn" id="burgerBtn" aria-label="Открыть меню">☰</button>
        <div class="mobile-menu" id="mobileMenu">
            <nav>
                <a href="index.html">Главная</a>
                <a href="prices.html">Цены и концерты</a>
                <a href="register.html">Регистрация</a>
                <a href="account.html">Личный кабинет</a>
                <a href="login.html">Вход</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <h2>Личный кабинет пользователя</h2>
        <div class="account-card" style="background: white; padding: 25px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <h3>Профиль</h3>
            <p style="margin: 10px 0;"><strong>Имя:</strong> <span id="accName">—</span></p>
            <p style="margin: 10px 0;"><strong>Телефон:</strong> <span id="accPhone">—</span></p>
            <p style="margin: 10px 0;">
                <strong>Email:</strong> <span id="accEmail">—</span><span id="adminBadge" style="display: none; margin-left: 6px; color: #16a34a; font-weight: bold;" title="Подтверждено">✔</span>
            </p>
            <p style="margin: 10px 0;"><strong>Пароль:</strong> <span class="no-copy" style="user-select: none; letter-spacing: 2px;">••••••••</span></p>
            <p style="margin: 10px 0;"><strong>Привязанная карта:</strong> <span id="accCard">Не привязана</span></p>

            <!-- Блок активации прав администратора кодом -->
            <div id="adminAccessSection" style="margin-top: 20px; padding: 15px; background: #f8f9fc; border-radius: 8px; border: 1px solid #e2e6f3;">
                <p style="font-size: 14px; margin-bottom: 8px;"><strong>Активация специального доступа:</strong></p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="password" id="adminCodeInput" placeholder="Код доступа" oncopy="return false;" style="padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
                    <button type="button" id="activateAdminBtn" style="padding: 8px 16px; background: #2b70ff; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Активировать</button>
                </div>
                <p id="adminCodeMsg" style="font-size: 13px; margin-top: 6px; color: #1a56db;"></p>
            </div>

            <div id="adminConsoleLinkBox" style="display: none; margin-top: 15px;">
                <a href="admin-console.html" class="table-btn">Открыть консоль управления билетами</a>
            </div>

            <h3 style="margin-top: 25px;">Ваши билеты и заказы</h3>
            <div id="ticketHistory" style="margin-top: 15px; background: #f4f5fa; padding: 15px; border-radius: 8px;">
                <p style="color: #666;">Загрузка...</p>
            </div>

            <button id="logoutBtn" style="margin-top: 25px; padding: 10px 20px; background: #d93838; color: white; border: none; border-radius: 6px; cursor: pointer;">Выйти из аккаунта</button>
        </div>
    </main>

    <footer class="footer">
        <p><a href="index.html">&larr; На главную</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
